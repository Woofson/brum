[plugin]
id = "tailspin"
name = "Tailspin"
version = "1.0.0"
author = "Bolt J Woofson <bolt@arf.ac>"
description = "Decision wheel with your own lists, a quick yes or no, and dice for D&D and Yatzy."
homepage = "https://www.arf.ac"
icon = "assets/icon.svg"
category = "utilities"

[ui]
modes = ["floating", "docked"]
default_mode = "floating"
default_width = 460
default_height = 640
min_width = 320
min_height = 440

[integrations]
launchpad = true
launchpad_label = "Tailspin"

[permissions]
permissions = []
