<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f2128" />
      <stop offset="100%" stop-color="#14151a" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background Rounded Shield -->
  <rect x="8" y="8" width="112" height="112" rx="26" fill="url(#bgGrad)" stroke="#333742" stroke-width="3" />
  <rect x="12" y="12" width="104" height="104" rx="22" fill="none" stroke="rgba(245, 158, 11, 0.25)" stroke-width="1.5" />
  
  <!-- Left Half File -->
  <path d="M 28 32 L 56 32 L 56 96 L 28 96 Z" fill="rgba(245, 158, 11, 0.12)" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="none" rx="2" />
  <!-- Right Half File -->
  <path d="M 72 32 L 100 32 L 100 96 L 72 96 Z" fill="rgba(245, 158, 11, 0.12)" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="none" rx="2" />
  
  <!-- Center Split Line -->
  <line x1="64" y1="26" x2="64" y2="102" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4,4" opacity="0.8" />
  
  <!-- Cutting Scissors (Center) -->
  <g filter="url(#glow)">
    <!-- Scissor Loop 1 -->
    <circle cx="44" cy="84" r="11" fill="none" stroke="url(#amberGrad)" stroke-width="4.5" />
    <!-- Scissor Loop 2 -->
    <circle cx="84" cy="84" r="11" fill="none" stroke="url(#amberGrad)" stroke-width="4.5" />
    <!-- Scissor Blades -->
    <line x1="48" y1="76" x2="82" y2="44" stroke="url(#amberGrad)" stroke-width="5" stroke-linecap="round" />
    <line x1="80" y1="76" x2="46" y2="44" stroke="url(#amberGrad)" stroke-width="5" stroke-linecap="round" />
    <!-- Pivot Pin -->
    <circle cx="64" cy="60" r="3.5" fill="#fef3c7" stroke="#92400e" stroke-width="1.5" />
  </g>
</svg>
