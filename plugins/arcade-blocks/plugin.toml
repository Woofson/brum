[plugin]
id = "arcade-blocks"
name = "Arcade Blocks"
version = "1.0.0"
author = "Bolt J Woofson <bolt@arf.ac>"
description = "Classic arcade falling blocks puzzle game with marathon, sprint, and high-score leaderboards."
homepage = "https://www.arf.ac"
icon = "assets/icon.webp"
category = "games"

[ui]
modes = ["floating", "docked"]
default_mode = "floating"
default_width = 540
default_height = 680
min_width = 380
min_height = 480

[integrations]
launchpad = true
launchpad_label = "Arcade Blocks"
shortcut = "Ctrl+Alt+T"

[permissions]
permissions = ["ui:notify"]
