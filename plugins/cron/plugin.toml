[plugin]
id = "cron"
name = "Cron Builder"
version = "1.0.0"
author = "Bolt J Woofson <bolt@arf.ac>"
description = "Write cron schedules in plain words, read cron lines back with their next run times, and get the systemd timer form."
homepage = "https://www.arf.ac"
icon = "assets/icon.svg"
category = "utilities"

[ui]
modes = ["floating", "docked"]
default_mode = "floating"
default_width = 540
default_height = 680
min_width = 330
min_height = 440

[integrations]
launchpad = true
launchpad_label = "Cron Builder"

[permissions]
permissions = ["ui:notify", "clipboard:write"]
