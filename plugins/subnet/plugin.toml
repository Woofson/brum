[plugin]
id = "subnet"
name = "Subnet Calculator"
version = "1.0.0"
author = "Bolt J Woofson <bolt@arf.ac>"
description = "IPv4 and IPv6 subnets: ranges, masks, splitting and combining networks, and the special address ranges."
homepage = "https://www.arf.ac"
icon = "assets/icon.svg"
category = "utilities"

[ui]
modes = ["floating", "docked"]
default_mode = "floating"
default_width = 520
default_height = 660
min_width = 330
min_height = 440

[integrations]
launchpad = true
launchpad_label = "Subnet Calculator"

[permissions]
permissions = ["ui:notify", "clipboard:write"]
