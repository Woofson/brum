name: Windows Build Check

# Started by hand: builds brum.exe exactly like a release, checks it, and offers it as a
# download (for testing on a Windows machine). Publishes nothing.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Check brum.exe runs without the Visual C++ runtime
        shell: pwsh
        run: |
          $Exe = "target\x86_64-pc-windows-msvc\release\brum.exe"
          $Text = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes($Exe))
          if ($Text -match '(?i)vcruntime140') { throw "brum.exe still needs VCRUNTIME140.dll; check .cargo/config.toml (crt-static)" }
          Write-Host "brum.exe does not need the Visual C++ runtime."
          & $Exe --version

      - uses: actions/upload-artifact@v4
        with:
          name: brum-windows-x64
          path: target/x86_64-pc-windows-msvc/release/brum.exe
          retention-days: 7
