[package]
name = "brum"
version = "1.6.3"
edition = "2021"
authors = ["Bolt J Woofson <bolt@boop.no>"]
description = "Multi-Pane Web Environment (File Commander/Manager) - By Woofson"
license = "MIT"
repository = "https://github.com/Woofson/brum"
homepage = "https://github.com/Woofson/brum"
documentation = "https://github.com/Woofson/brum#readme"
readme = "README.md"
keywords = ["file-manager", "commander", "web", "terminal", "vfs"]
categories = ["command-line-utilities", "web-programming"]
exclude = [
    "src-tauri/**",
    "packaging/**",
    "scripts/**",
    ".github/**",
    "assets/**",
    "brumlogo/**",
    "screenshot.png",
    "feedback/**",
    "tests/**",
    "frontend/assets/*.png",
    "dist/**",
    "*.tar.gz",
    "*.deb",
    "*.apk",
    ".build_counter"
]

[lib]
name = "brum"
path = "src/lib.rs"

[[bin]]
name = "brum"
path = "src/main.rs"

[dependencies]
open = "5.3"
filetime = "0.2"
crc32fast = "1.4"
futures-util = "0.3"
portable-pty = "0.8"
dirs = "5.0"
libc = "0.2"
axum = { version = "0.7", features = ["ws", "multipart"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
tower-http = { version = "0.5", features = ["cors", "trace", "compression-gzip", "compression-br", "compression-zstd"] }
rust-embed = { version = "8", features = ["mime-guess"] }
mime_guess = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
argon2 = "0.5"
chacha20poly1305 = "0.10"
rand = "0.8"
jsonwebtoken = "9.3"
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
walkdir = "2.5"
rayon = "1.10"
similar = { version = "2.6", features = ["inline", "bytes"] }
zip = { version = "2.2", default-features = false, features = ["deflate", "bzip2", "time"] }
tar = "0.4"
flate2 = "1.0"
bzip2 = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
aes-gcm = "0.10"
getrandom = "0.2"
ssh2 = { version = "0.9", features = ["vendored-openssl", "openssl-on-win32"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
tempfile = "3.16"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1.12", features = ["v4", "serde"] }
parking_lot = "0.12"
async-trait = "0.1"
base64 = "0.22"
hmac = "0.12"
regex = "1.11"
lopdf = "0.34"
iso9660-rs = { version = "1.0", features = ["all-extensions"] }
gpt_disk_io = { version = "0.16", features = ["std"] }
gpt_disk_types = "0.16"
hadris-udf = "2.4.0"
backhand = "0.25"
wry = { version = "0.47", optional = true }
tao = { version = "0.30", optional = true }
fatfs = "0.3.6"
mbr-nostd = "0.1.0"
ext4 = "0.9.0"
ntfs = "0.4"
positioned-io = "=0.2.2"
zstd = "0.13"

[target.'cfg(not(target_os = "windows"))'.dependencies]
openssl = { version = "0.10", features = ["vendored"] }

[target.'cfg(windows)'.dependencies]
windows-service = "0.7"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_UI_Shell",
    "Win32_System_RestartManager",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_Security",
    "Win32_Security_Authorization",
] }

[build-dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[features]
default = []
gui = ["dep:wry", "dep:tao"]
pam = []
desktop-app = []

[package.metadata.deb]
maintainer = "Bolt J Woofson <bolt@boop.no>"
copyright = "2026, Bolt J Woofson <bolt@boop.no>"
license-file = ["LICENSE", "4"]
extended-description = """\
Multi-Tab Web Commander blending the orthodox speed of Total Commander / \
Midnight Commander with the modern responsiveness of Next Explorer. Features \
1-to-4 toggleable panes, WebDAV/SFTP, S3 Cloud Storage, DeltaCopy/TeraCopy \
engine, floating multi-tab power editor with Markdown & Mermaid, slide-up web terminal, \
directory sync, and 11 customizable themes."""
section = "utils"
priority = "optional"
depends = "$auto, ca-certificates, tar, bzip2, 7zip | p7zip-full"
maintainer-scripts = "packaging/debian"
assets = [
    ["target/release/brum", "usr/bin/brum", "755"],
    ["brum.service", "usr/lib/systemd/system/brum.service", "644"],
    ["brum.desktop", "usr/share/applications/brum.desktop", "644"],
    ["config.toml", "etc/brum/config.toml", "644"],
    ["assets/brum.png", "usr/share/pixmaps/brum.png", "644"],
    ["README.md", "usr/share/doc/brum/README.md", "644"],
    ["plugins/calculator.grr", "usr/share/brum/plugins/calculator.grr", "644"],
    ["plugins/tetrion.grr", "usr/share/brum/plugins/tetrion.grr", "644"],
    ["themes/amber.toml", "etc/brum/themes/amber.toml", "644"],
    ["themes/catppuccin.toml", "etc/brum/themes/catppuccin.toml", "644"],
    ["themes/cyberpunk.toml", "etc/brum/themes/cyberpunk.toml", "644"],
    ["themes/dracula.toml", "etc/brum/themes/dracula.toml", "644"],
    ["themes/gruvbox.toml", "etc/brum/themes/gruvbox.toml", "644"],
    ["themes/kittelsen.toml", "etc/brum/themes/kittelsen.toml", "644"],
    ["themes/monokai.toml", "etc/brum/themes/monokai.toml", "644"],
    ["themes/nord.toml", "etc/brum/themes/nord.toml", "644"],
    ["themes/solarized.toml", "etc/brum/themes/solarized.toml", "644"],
    ["themes/tokyo-night.toml", "etc/brum/themes/tokyo-night.toml", "644"],
]
