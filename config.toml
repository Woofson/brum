# ==============================================================================
# 🐕 Brum Master Configuration File
# Location: ~/.config/brum/config.toml (or /etc/brum/config.toml)
# ==============================================================================

# --- Core Server Settings ---
[server]
host = "0.0.0.0"                 # "0.0.0.0" to listen on all network interfaces, "127.0.0.1" for local-only
port = 3140                      # Brum standard default port
root_path = "/"                  # Root filesystem path
upload_max_size_mb = 10240       # Max file upload size in MB (10 GB)
enable_auth = true               # Enable authentication (automatically disabled in --standalone mode)
session_duration_hours = 72      # JWT session expiry duration in hours
database_path = "brum.db"        # SQLite local metadata and session database

# --- Authentication & Access Control ---
[auth]
mode = "mixed"                   # Options: "mixed" (PAM + Built-in), "builtin", "pam", "none"
pam_service = "login"            # Linux PAM service name
allow_guest = false              # Allow anonymous guest access
default_admin_user = "admin"     # Initial admin username
default_admin_pass = "brum"      # Initial admin password

# --- Storage Roots & Filesystem Sandboxing ---
[storage]
allow_entire_system = false           # When false, users and admins are strictly sandboxed to allowed root dirs + their personal home
default_user_home_template = "/home/{username}" # Template path for newly created virtual/DB users

[[storage.roots]]
id = "storage"
name = "Mass Storage"
path = "/mnt/storage"
read_only = false
# allowed_roles = ["admin", "user"]

[[storage.roots]]
id = "data"
name = "Application Data"
path = "/data"
read_only = false

[[storage.roots]]
id = "backups"
name = "Backups (Read-Only)"
path = "/mnt/backups"
read_only = true

# --- User Interface & Panels ---
[ui]
default_pane_count = 2           # Default number of visible panes on startup (1 to 4)
default_layout = "dual-vertical" # Options: "single", "dual-vertical", "dual-horizontal", "triple", "quad"
show_hidden_files = true         # Show hidden files and dotfiles (e.g. .bashrc, .git)
default_view_mode = "details"    # Options: "details", "compact", "grid"
window_decorations = true        # Set to false for seamless borderless/frameless mode in Hyprland / tiling WMs
show_global_refresh = false      # Minimal header (off by default; individual panes have dedicated refresh controls)

# --- Web Terminal (Bite!) & PTY Security ---
[terminal]
enabled = true                      # Enable / disable the web terminal feature
allow_roles = ["admin", "root"]     # Roles allowed to spawn terminal shells ("admin", "user", "*" for all)
allow_virtual_users = false         # Allow virtual/DB accounts without a local POSIX user (disabled by default for security)
drop_privileges = true              # Drop root privileges to match authenticated user when running as root daemon
# default_shell = "/bin/bash"       # Override default shell executable

# --- Standalone Desktop Window & System Tray ---
[desktop]
minimize_to_tray = true          # Minimize window to system tray when closed instead of terminating
enable_tray = true               # Enable system tray icon
global_summon_hotkey = "Super+C" # System-wide shortcut to summon/focus Brum (e.g. "Super+C", "Ctrl+Alt+Space")
start_minimized = false          # Launch directly to system tray on system boot / autostart

