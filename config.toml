# ==============================================================================
# Brum settings file
#
# You do not need to edit this file. Brum's settings are in Brum itself:
# open Admin → Server Settings. They are saved in Brum's database and explained
# there in plain words.
#
# This file only holds what Brum must know before it starts. Anything you add
# here wins over Server Settings, and is shown there as locked ("In config.toml").
# Every setting is described in the Configuration manual:
# https://github.com/Woofson/brum/wiki/Configuration
#
# Brum is made for home networks and VPNs (Tailscale, NetBird, WireGuard and
# similar). Never open it to the internet without a reverse proxy with logins
# or a VPN in front of it.
# ==============================================================================

[server]
# Where Brum keeps its database: accounts, settings, shares and more.
# A bare name is placed next to the program, or on Windows in
# C:\ProgramData\Brum (service or administrator) or %APPDATA%\Brum.
database_path = "brum.db"

# Set to false to allow changing settings only in this file, never in the page.
allow_web_config_edit = true

# Several machines (Fleet) need one shared signing key. Better than writing it
# here: the environment variable BRUM_JWT_SECRET, or a file named here.
# jwt_secret_file = "/etc/brum/jwt.secret"

# Also possible here instead of in Server Settings (a value here wins):
# host = "0.0.0.0"     # "0.0.0.0" = every network, "127.0.0.1" = only this computer
# port = 3140

[plugins]
# Where Chewtoys are kept
directory = "/etc/brum/plugins"
user_directory = "~/.config/brum/plugins"
