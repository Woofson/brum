# --- Paranoid File Integrity & Safety ---
[paranoid]
enabled = true                   # Pre-flight collision checks and integrity verification
checksum_algorithm = "sha256"    # "sha256", "crc32"
verify_after_transfer = true     # Verify bit-for-bit checksums after copy/move
atomic_writes = true             # Write to temp file first before renaming
trash_enabled = true             # Move to system trash instead of permanent delete
confirm_delete = true            # Prompt before deleting files
confirm_overwrite = true         # Prompt before overwriting existing files

# --- Syncthing P2P Integration ---
[syncthing]
enabled = true
url = "http://127.0.0.1:8384"
api_key = ""                     # Leave blank to auto-discover from ~/.config/syncthing/config.xml

# --- NoteDog Notes & Markdown Studio ---
[notedog]
notes_folder = "~/Notes"         # Custom path to notes directory (e.g. "~/Notes", "/mnt/storage/Notes", "~/Documents/Notes")

# --- Context Menu Custom Script Actions ---
[[custom_actions]]
id = "sha256-calc"
label = "Calculate SHA-256 Checksum"
icon = "shield-check"
command = "builtin:checksum:sha256"
applicable_to = "file"
in_background = false

[[custom_actions]]
id = "folder-diff"
label = "Compare with Other Pane (Diff)"
icon = "columns-2"
command = "builtin:diff"
applicable_to = "all"
in_background = false

[[custom_actions]]
id = "compress-zip"
label = "Compress to .zip"
icon = "archive"
command = "builtin:archive:zip"
applicable_to = "all"
in_background = true

[[custom_actions]]
id = "compress-targz"
label = "Compress to .tar.gz"
icon = "archive"
command = "builtin:archive:targz"
applicable_to = "all"
in_background = true

[[custom_actions]]
id = "extract-here"
label = "Extract Archive Here"
icon = "unarchive"
command = "builtin:archive:extract"
applicable_to = "archive"
in_background = true

# --- Default Bookmarks & Favorite Paths ---
[[bookmarks]]
id = "home"
name = "Home Directory"
protocol = "local"
path = "~"

[[bookmarks]]
id = "root"
name = "Root Filesystem"
protocol = "local"
path = "/"
