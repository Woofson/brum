# ==============================================================================
# 🐕 Brum Master Configuration File
# Location: ~/projects/brum/config.toml
# ==============================================================================

# --- Core Server Settings ---
[server]
host = "0.0.0.0"                 # "0.0.0.0" to listen on all network interfaces, "127.0.0.1" for local-only
port = 3140                      # Brum standard default port
root_path = "/"                  # Root filesystem path
upload_max_size_mb = 20480       # Max file upload size in MB (10 GB)
enable_auth = true               # Enable authentication (automatically disabled in --standalone mode)
session_duration_hours = 72      # JWT session expiry duration in hours
database_path = "brum.db"        # SQLite local metadata and session database

# --- Authentication & Access Control ---
[auth]
mode = "mixed"                   # Options: "mixed" (PAM + Built-in), "builtin", "pam", "none"
pam_service = "login"            # Linux PAM service name
allow_guest = false              # Allow anonymous guest access
default_admin_user = "admin"     # Initial admin username
default_admin_pass = "brum"      # Initial admin password

# --- Storage Roots & Filesystem Sandboxing ---
[storage]
allow_entire_system = true            # When true, admin users have unrestricted access to all local drives and system roots
default_user_home_template = "/home/{username}" # Template path for newly created virtual/DB users (e.g. "/data/users/{username}" or "C:/Users/{username}")
home_fallback_scheme = "auto"         # Options: "auto" (smart auto-creation & fallback cascade), "roots_only" (pure storage roots, no home), "strict"
auto_create_home_dirs = true          # Automatically create missing user home directories on login/init if writable

