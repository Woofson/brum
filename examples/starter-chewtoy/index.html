<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Starter ChewToy</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="starter-chewtoy-container">
    <!-- 42px Grab Header (Rule 9 standard) -->
    <header class="starter-header">
      <div class="starter-title">
        <img src="assets/icon.svg" width="16" height="16" alt="Icon" />
        <span>Starter Chewtoy</span>
        <span class="starter-badge">v1.0.0</span>
      </div>
      <div class="starter-actions">
        <button class="starter-btn" id="btn-ping" title="Send notification to host Brum UI">🔔 Send Toast</button>
        <button class="starter-btn" id="btn-dock1" title="Dock into Left Panel (Pane 1)">◧ Dock Left</button>
        <button class="starter-btn" id="btn-dock2" title="Dock into Right Panel (Pane 2)">◨ Dock Right</button>
      </div>
    </header>

    <!-- Content Workspace -->
    <main class="starter-body">
      <!-- Top Overview & Context Card -->
      <div class="starter-card">
        <div class="starter-card-header">
          <span class="starter-card-title">🐶 Host Bridge Context</span>
          <span id="sdk-status" class="status-indicator">Connected to window.Brum</span>
        </div>
        <p class="starter-desc">
          Live environment properties passed dynamically from the active Brum file manager instance:
        </p>
        <div class="starter-code" id="context-display">Waiting for host context...</div>
      </div>

      <!-- Interactive Actions Row -->
      <div class="starter-card">
        <div class="starter-card-header">
          <span class="starter-card-title">⚡ Interactive Chewtoy Features</span>
        </div>
        <div class="starter-btn-row">
          <button class="starter-btn btn-accent" id="btn-list-dir">📂 List Active Directory</button>
          <button class="starter-btn btn-primary" id="btn-read-file">📄 Read Selected File</button>
          <button class="starter-btn btn-write" id="btn-write-file">✍️ Write Test Note (chewtoy-note.txt)</button>
          <button class="starter-btn" id="btn-confirm-dialog">❓ Ask Host Confirmation</button>
        </div>
      </div>

      <!-- Results & Inspector Display -->
      <div class="starter-card starter-card-flex">
        <div class="starter-card-header">
          <span class="starter-card-title" id="output-title">📄 Output & Inspector</span>
          <button class="starter-btn btn-xs" id="btn-clear-output">Clear</button>
        </div>
        <div class="starter-code starter-output" id="output-display">Click any action above to test filesystem integration...</div>
      </div>
    </main>
  </div>

  <script src="main.js"></script>
</body>
</html>
